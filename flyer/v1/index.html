<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #62b8e8; }
      /* Camera: one transformed world, 1 unit = 1 px of the 1080x1350 poster. */
      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 0 0; }
      #cam img { position: absolute; display: block; }
      /* Every SVG export shares a 1122.38-wide artboard whose origin sits 10px left of the poster (fitted by template matching). */
      .art { left: -10px; top: 0; width: 1122.38px; height: 1349.1px; }
      .art.tall { height: 1360.16px; }
      .full { left: 0; top: 0; width: 1080px; height: 1350px; }
      .crop { position: absolute; overflow: hidden; }
      #car-wrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 450px 1195px; }
      #car { transform-origin: 450px 1195px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main-v1" data-start="0" data-duration="24" data-width="1080" data-height="1350">
      <div id="cam">
        <img class="full" src="../assets/blue-background.jpg" alt="" />
        <img id="clouds" class="full" src="../assets/clouds.svg" alt="" />
        <img class="art" src="../assets/road.svg" alt="" />
        <img class="art" src="../assets/signboard.svg" alt="" />
        <div id="car-wrap"><img id="car" class="art" src="../assets/car.svg" alt="" /></div>
        <img id="date" class="art tall" src="../assets/date-venue.svg" alt="" />

        <!-- activities.svg also carries the date text, so crop to the left column -->
        <div class="crop" style="left:0;top:0;width:545px;height:1350px">
          <img id="act-full" class="art tall" src="../assets/activities.svg" alt="" />
          <img class="art tall act-band" data-b="530,593" src="../assets/activities.svg" alt="" />
          <img class="art tall act-band" data-b="593,626" src="../assets/activities.svg" alt="" />
          <img class="art tall act-band" data-b="626,665" src="../assets/activities.svg" alt="" />
          <img class="art tall act-band" data-b="665,745" src="../assets/activities.svg" alt="" />
        </div>

        <!-- title, split into bands so it can be revealed in stages -->
        <img id="t-full" class="art tall" src="../assets/main-climax-logo.svg" alt="" />
        <img id="t-a" class="art tall t-band" src="../assets/main-climax-logo.svg" alt="" />
        <img id="t-b" class="art tall t-band" src="../assets/main-climax-logo.svg" alt="" />
        <img id="t-c" class="art tall t-band" src="../assets/main-climax-logo.svg" alt="" />
        <img id="t-d" class="art tall t-band" src="../assets/main-climax-logo.svg" alt="" />
        <img id="t-e" class="art tall t-band" src="../assets/main-climax-logo.svg" alt="" />

        <div id="spons" class="crop" style="left:0;top:1240px;width:1080px;height:110px">
          <img class="art tall" style="top:-1240px" src="../assets/partmer-sponsors.svg" alt="" />
        </div>
        <img id="logos" src="../assets/logos-on-top.png" alt="" style="left:290px;top:32px;width:474px" />
      </div>
      <img id="poster" class="full" src="../assets/main-poster.jpg" alt="" style="position:absolute;opacity:0" />
    </div>
    <script>
      const W = 1122.38, H = 1360.16;
      const inset = (t, r, b, l) => `inset(${t}px ${r}px ${b}px ${l}px)`;
      const tl = gsap.timeline({ paused: true });

      // ---- camera: centre (cx,cy) at zoom k ----
      const cam = (cx, cy, k) => ({ x: 540 - cx * k, y: 675 - cy * k, scale: k });
      gsap.set("#cam", cam(540, 880, 1.46));
      tl.to("#cam", { ...cam(540, 880, 1.5), duration: 3.8, ease: "sine.inOut" }, 0);
      tl.to("#cam", { ...cam(775, 705, 1.9), duration: 1.8, ease: "power3.inOut" }, 3.8);     // sign
      tl.to("#cam", { ...cam(305, 650, 2.2), duration: 1.5, ease: "power3.inOut" }, 7.6);     // activities
      tl.to("#cam", { ...cam(397, 470, 1.45), duration: 1.6, ease: "power3.inOut" }, 12.0);   // title
      tl.to("#cam", { ...cam(540, 675, 1), duration: 2.0, ease: "power3.inOut" }, 16.0);      // full poster

      // ---- 0-4s: clouds + van approach ----
      tl.fromTo("#clouds", { x: -30 }, { x: 0, duration: 19, ease: "power1.out" }, 0);
      tl.fromTo("#car-wrap", { scale: 0.08, y: -25, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 3.4, ease: "power2.out" }, 0.2);
      tl.to("#car", { y: -3, duration: 0.37, ease: "sine.inOut", repeat: 39, yoyo: true }, 3.6);  // 40 legs, ends at rest
      tl.set("#car", { y: 0 }, 18.4);

      // ---- 4-8s: date and venue ----
      gsap.set("#date", { clipPath: inset(0, 572, 0, 0), opacity: 0 });
      tl.to("#date", { opacity: 1, duration: 0.4, ease: "none" }, 5.0);
      tl.to("#date", { clipPath: inset(0, 134, 0, 0), duration: 1.8, ease: "power2.inOut" }, 5.0);
      tl.set("#date", { clipPath: "none" }, 7.0);

      // ---- 8-12s: activities, one item at a time ----
      gsap.set("#act-full", { opacity: 0 });
      document.querySelectorAll(".act-band").forEach((el, i) => {
        const [y0, y1] = el.dataset.b.split(",").map(Number);
        const hidden = inset(y0, W - 100, H - y1, 0), shown = inset(y0, W - 562, H - y1, 0);
        gsap.set(el, { clipPath: hidden, opacity: 0 });
        const t = 8.5 + i * 0.9;
        tl.to(el, { opacity: 1, duration: 0.3, ease: "none" }, t);
        tl.to(el, { clipPath: shown, duration: 0.8, ease: "power2.out" }, t);
      });
      tl.set("#act-full", { opacity: 1 }, 12.0);
      tl.set(".act-band", { opacity: 0 }, 12.0);

      // ---- 12-16s: title ----
      const band = (id, t, r, b, l) => gsap.set(id, { clipPath: inset(t, r, b, l), opacity: 0 });
      gsap.set("#t-full", { opacity: 0 });
      band("#t-a", 0, 0, 1164.16, 0);
      band("#t-b", 196, 0, 1054.16, 0);
      band("#t-c", 306, 754.38, 890.16, 0);
      band("#t-d", 470, 0, 835.16, 0);
      band("#t-e", 306, 382.38, 890.16, 368);
      tl.fromTo("#t-a", { y: 30 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 12.6);
      tl.fromTo("#t-b", { y: 30 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 13.1);
      tl.fromTo("#t-c", { x: -40 }, { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 13.6);
      tl.fromTo("#t-e", { scale: 0.85, transformOrigin: "546px 388px" }, { scale: 1, duration: 0.7, ease: "back.out(2.2)" }, 14.3);
      tl.to("#t-e", { opacity: 1, duration: 0.25, ease: "none" }, 14.3);
      tl.to("#t-d", { opacity: 1, duration: 0.3, ease: "none" }, 15.1);
      tl.fromTo("#t-d", { clipPath: inset(470, W - 80, 835.16, 0) }, { clipPath: inset(470, 0, 835.16, 0), duration: 0.8, ease: "power2.out" }, 15.1);
      tl.set("#t-full", { opacity: 1 }, 16.0);
      tl.set(".t-band", { opacity: 0 }, 16.0);

      // ---- 16-19s: organisers and sponsors, camera pulls back ----
      gsap.set("#logos", { opacity: 0 });
      gsap.set("#spons", { opacity: 0 });
      tl.fromTo("#logos", { y: -24 }, { y: 0, opacity: 1, duration: 1.0, ease: "power2.out" }, 16.4);
      tl.fromTo("#spons", { y: 110 }, { y: 0, opacity: 1, duration: 1.0, ease: "power2.out" }, 17.0);

      // ---- 19-24s: final hold; exact poster takes over once layers are settled ----
      tl.to("#poster", { opacity: 1, duration: 0.6, ease: "none" }, 18.8);

      window.__timelines["main-v1"] = tl;
    </script>
  </body>
</html>
